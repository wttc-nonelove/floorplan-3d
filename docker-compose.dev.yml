services:
  floorplan-3d-dev:
    image: nginx:alpine
    container_name: floorplan-3d-dev
    ports:
      - "8081:80"
    volumes:
      # 直接挂载工作区文件，改完刷新浏览器即可，不必重建镜像
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
