server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 不回显版本号
    server_tokens off;

    # 站点是单文件应用：CSS / JS / SVG 全部内联在 index.html 里，
    # 唯一会变的资源就是它本身，所以 gzip 必须开，否则每次首屏要传 700KB+。
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # 健康检查：只验证 nginx 在服务，不触发整页传输，也不写访问日志
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 入口文件的缓存策略是这里唯一需要动脑的地方：
    # 没有文件名哈希可以做长期缓存，一旦被浏览器缓存住，发版后用户会一直看到旧版本，
    # 因此必须每次回源校验（no-cache 允许缓存，但每次都要 revalidate，命中 304 时几乎零开销）。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
